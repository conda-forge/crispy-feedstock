{% set name = "crispy" %}
{% set version = "2026.3" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 8bbe69f9b83692947f2780e3cad9d0cce626c25cda027a6d7718f008fff675e6

build:
  number: 0
  script: '{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv '
  noarch: python
  entry_points:
    - crispy = crispy.__main__:main

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - h5py
    - matplotlib-base
    - numpy
    - python >={{ python_min }}
    - silx-base
    - pyside6
    - qtawesome
    - ruamel.yaml
    - xraydb

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - crispy
  commands:
    - pip check

about:
  home: https://github.com/mretegan/crispy
  license: MIT
  license_family: MIT
  license_file: LICENSE.rst
  summary: Core-Level Spectroscopy Simulations in Python
  doc_url: http://www.esrf.eu/computing/scientific/crispy/
  dev_url: http://www.esrf.eu/computing/scientific/crispy/

extra:
  recipe-maintainers:
    - tschoonj
