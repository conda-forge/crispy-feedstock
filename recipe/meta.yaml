{% set name = "crispy" %}
{% set version = "2026.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 122d6f9c7e1064f8eec61dc45ecd7a9a3aa0692bdfb1d244693945e9fde127d8

build:
  number: 0
  script: '{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv '
  noarch: python
  entry_points:
    - crispy = crispy.__main__:main

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - h5py
    - matplotlib-base
    - numpy
    - python >={{ python_min }}
    - silx-base

test:
  requires:
    - python {{ python_min }}
  imports:
    - crispy
    - crispy.gui
    - crispy.gui.icons
    - crispy.gui.uis
    - crispy.modules
    - crispy.modules.orca
    - crispy.modules.quanty
    - crispy.utils

about:
  home: https://github.com/mretegan/crispy
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Core-Level Spectroscopy Simulations in Python
  doc_url: http://www.esrf.eu/computing/scientific/crispy/
  dev_url: http://www.esrf.eu/computing/scientific/crispy/

extra:
  recipe-maintainers:
    - tschoonj
